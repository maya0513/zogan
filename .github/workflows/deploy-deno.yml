name: deploy-deno (disabled)

on:
  workflow_dispatch:

jobs:
  disabled:
    name: Deno Deploy uses the GitHub integration
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deployment is managed by Deno Deploy's GitHub integration."

